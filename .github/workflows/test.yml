name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/project-notes/web/go.mod
          cache: false
      - run: npm install --global @anthropic-ai/claude-code
      - run: |
          for manifest in plugins/*/package.json; do
            (cd "$(dirname "$manifest")" && pnpm install --frozen-lockfile)
          done
      - run: bun install --frozen-lockfile
        working-directory: design-studio
      - run: ./check

  </head>
  <body data-menu="closed">
    <a class="skip-link" href="#note">Skip to Note</a>
    <header class="topbar">
      <button
        class="icon-button"
        id="menu-button"
        type="button"
        aria-expanded="false"
        aria-controls="sidebar"
        aria-label="Open Notes List"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h10" />
        </svg>
      </button>
      <span class="brand" translate="no"><span class="mark" aria-hidden="true"></span>Claude notes</span>
    </header>
    <div class="backdrop" hidden></div>
    <nav id="sidebar" aria-label="All notes"></nav>
    <main id="note" tabindex="-1" aria-busy="true">
      <p class="empty" role="status">Loading notes…</p>
    </main>
    <div class="toast-region" role="status" aria-live="polite"></div>

    <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-message"></p>
        <div class="dialog-actions">
          <button class="button" value="cancel" id="confirm-cancel">Keep It</button>
          <button class="button danger" value="confirm" id="confirm-button"></button>
        </div>
      </form>
    </dialog>

    <dialog id="add-plan-dialog" aria-labelledby="add-plan-title" aria-describedby="add-plan-set">
      <form method="dialog" id="add-plan-form">
        <h2 id="add-plan-title">Add a Plan</h2>
        <p id="add-plan-set"></p>
        <label for="plan-title">Plan title</label>
        <input id="plan-title" name="title" required autocomplete="off" maxlength="100" placeholder="Clear the cached token…" />
        <p class="field-error" id="add-plan-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button class="button" type="button" id="add-plan-cancel">Cancel</button>
          <button class="button primary" value="confirm" id="add-plan-button">Add Plan</button>
        </div>
      </form>
    </dialog>

    <dialog id="rename-project-dialog" aria-labelledby="rename-project-title" aria-describedby="rename-project-scope">
      <form method="dialog" id="rename-project-form">
        <h2 id="rename-project-title">Rename Project</h2>
        <p id="rename-project-scope"></p>
        <label for="project-name">New name</label>
        <input id="project-name" name="name" required autocomplete="off" spellcheck="false" maxlength="100" />
        <p class="field-error" id="rename-project-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button class="button" type="button" id="rename-project-cancel">Cancel</button>
          <button class="button primary" value="confirm" id="rename-project-button">Rename</button>
        </div>
      </form>
    </dialog>

    <script>
      const sidebar = document.querySelector("nav");
      const entryArea = document.querySelector("main");
      const menuButton = document.querySelector("#menu-button");
      const backdrop = document.querySelector(".backdrop");
      const toastRegion = document.querySelector(".toast-region");
      const confirmDialog = document.querySelector("#confirm-dialog");
      const addPlanDialog = document.querySelector("#add-plan-dialog");
      const addPlanForm = document.querySelector("#add-plan-form");
      const renameProjectDialog = document.querySelector("#rename-project-dialog");
      const renameProjectForm = document.querySelector("#rename-project-form");
      const narrowScreen = matchMedia("(max-width: 720px)");
      let sections = [];
      let openEditor = null;

      const ICONS = {
        pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
        trash: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        check: '<path d="M20 6 9 17l-5-5"/>',
        chevron: '<path d="m6 9 6 6 6-6"/>',
      };

      const COLLAPSED_STORAGE_KEY = "claude-notes:collapsed";

      const readCollapsedKeys = () => {
        try {
          return new Set(JSON.parse(localStorage.getItem(COLLAPSED_STORAGE_KEY)) ?? []);
        } catch (error) {
          return new Set();
        }
      };

      const collapsedKeys = readCollapsedKeys();

      const saveCollapsedKeys = () => {
        try {
          localStorage.setItem(COLLAPSED_STORAGE_KEY, JSON.stringify([...collapsedKeys]));
        } catch (error) {
          return;
        }
      };

      const EMPTY_HINTS = {
        handoffs: ["No handoffs yet", "Run /handoff and your future self gets a head start."],
        "project-notes": ["No project notes yet", "Ask Claude to write one, or run /project-note."],
        "small-plans": ["No plans yet", "Run /small-plans to break big work into bite-size pieces."],
        brainstorm: ["No brainstorm plans yet", "Run /brainstorm, then /brainstorm plan. Big ideas welcome."],
      };

      const SAVED_MESSAGES = ["Saved. Future you says thanks.", "Saved and sound.", "Changes tucked in safely."];
      const DELETED_MESSAGES = ["Poof. Gone for good.", "Deleted. Clean slate.", "Swept away."];
      const ADDED_MESSAGES = ["New plan, fresh page.", "Plan added. Let’s go."];

      const pickOne = (choices) => choices[Math.floor(Math.random() * choices.length)];

      const greetByHour = () => {
        const hour = new Date().getHours();
        if (hour < 5) return "Burning the midnight oil?";
        if (hour < 12) return "Good morning.";
        if (hour < 18) return "Good afternoon.";
        return "Good evening.";
      };

      const createElement = (tagName, text, className) => {
        const element = document.createElement(tagName);
        if (text) element.textContent = text;
        if (className) element.className = className;
        return element;
      };

      const createIcon = (iconName) => {
        const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        icon.setAttribute("viewBox", "0 0 24 24");
        icon.setAttribute("fill", "none");
        icon.setAttribute("stroke", "currentColor");
        icon.setAttribute("stroke-width", "2");
        icon.setAttribute("stroke-linecap", "round");
        icon.setAttribute("stroke-linejoin", "round");
        icon.setAttribute("aria-hidden", "true");
        icon.innerHTML = ICONS[iconName];
        return icon;
      };

      const createButton = (label, iconName, className, onClick) => {
        const button = createElement("button", "", className);
        button.type = "button";
        if (iconName) button.append(createIcon(iconName));
        button.append(label);
        button.addEventListener("click", onClick);
        return button;
      };

      const createIconButton = (label, iconName, className, onClick) => {
        const button = createElement("button", "", `icon-button ${className}`);
        button.type = "button";
        button.setAttribute("aria-label", label);
        button.title = label;
        button.append(createIcon(iconName));
        button.addEventListener("click", onClick);
        return button;
      };

      const showToast = (message, tone) => {
        const toast = createElement("div", message, "toast");
        if (tone) toast.dataset.tone = tone;
        toastRegion.append(toast);
        setTimeout(() => {
          toast.dataset.leaving = "";
          setTimeout(() => toast.remove(), 220);
        }, 3200);
      };

      const formatCreated = (created) => {
        if (!created) return "";
        const isDateOnly = created.length <= 10;
        const moment = new Date(created);
        if (Number.isNaN(moment.getTime())) return created;
        return new Intl.DateTimeFormat(undefined, isDateOnly ? { dateStyle: "medium", timeZone: "UTC" } : { dateStyle: "medium", timeStyle: "short" }).format(moment);
      };

      const buildNoteUrl = (sectionId, entryPath) => `/api/notes/${encodeURIComponent(sectionId)}/${entryPath.split("/").map(encodeURIComponent).join("/")}`;

      const buildGroupUrl = (sectionId, project, group) => `/api/groups/${[sectionId, project, group].map(encodeURIComponent).join("/")}`;

      const sendChange = async (method, url, body) => {
        const response = await fetch(url, {
          method,
          body,
          headers: body === undefined ? {} : { "Content-Type": "text/markdown; charset=utf-8" },
        });
        if (!response.ok) {
          const failure = new Error((await response.text()).trim() || response.statusText);
          failure.isRefusal = response.status >= 400 && response.status < 500;
          throw failure;
        }
        return response;
      };

      const describeFailure = (action, error) =>
        error.isRefusal ? error.message : `Couldn’t ${action}. ${error.message} Check the viewer is still running, then try again.`;

      const askToConfirm = ({ title, message, confirmLabel }) =>
        new Promise((resolve) => {
          confirmDialog.querySelector("#confirm-title").textContent = title;
          confirmDialog.querySelector("#confirm-message").textContent = message;
          confirmDialog.querySelector("#confirm-button").textContent = confirmLabel;
          confirmDialog.returnValue = "";
          confirmDialog.addEventListener("close", () => resolve(confirmDialog.returnValue === "confirm"), { once: true });
          confirmDialog.showModal();
          confirmDialog.querySelector("#confirm-cancel").focus();
        });

      const readSelection = () => {
        const [sectionId, ...pathSegments] = decodeURIComponent(location.hash.slice(1)).split("/");
        const section =
          sections.find((candidate) => candidate.id === sectionId) ??
          sections.find((candidate) => candidate.entries.length) ??
          sections[0];
        const entryPath = pathSegments.join("/");
        const entry = section?.entries.find((candidate) => candidate.path === entryPath) ?? section?.entries[0];
        return { section, entry };
      };

      const readStatus = (entry) => entry.fields.status ?? "pending";

      const titleAcronyms = new Set(["ai", "api", "ui", "ux", "cli", "ci", "pr", "url", "id", "mcp", "sdk", "json", "html", "css", "llm", "pdf", "sql", "csv"]);

      const kebabWordPattern = /(?<![\w/.\\-])[A-Za-z][A-Za-z0-9]*(?:-[A-Za-z0-9]+)+(?![\w/.\\-])/g;

      const formatDisplayName = (text) =>
        String(text)
          .split(/(`[^`]*`)/)
          .map((part, index) =>
            index % 2 === 1
              ? part
              : part.replace(kebabWordPattern, (word) => {
                  const pieces = word.split("-");
                  if (pieces.some((piece) => /^\d+$/.test(piece))) return word;
                  return pieces
                    .map((piece) =>
                      titleAcronyms.has(piece.toLowerCase())
                        ? piece.toUpperCase()
                        : piece.charAt(0).toUpperCase() + piece.slice(1)
                    )
                    .join(" ");
                })
          )
          .join("");

      const formatStatusLabel = (status) =>
        status
          .split("-")
          .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
          .join(" ");

      const readKind = (entry) => entry.fields.kind ?? "chore";

      const readOrder = (entry) => entry.name.slice(0, 2);

      const listGroupEntries = (section, memberEntry) =>
        section.entries.filter((entry) => entry.project === memberEntry.project && entry.group === memberEntry.group);

      const readDependency = (entry) =>
        entry.fields.depends_on && entry.fields.depends_on !== "none" && `needs plan ${entry.fields.depends_on}`;

      const PLAN_VIEW = {
        noun: "plan",
        describeLink: (entry) => ({
          label: `${readOrder(entry)} ${entry.title}`,
          caption: `${readKind(entry)} · ${formatStatusLabel(readStatus(entry))}`,
          status: readStatus(entry),
        }),
        hasProgress: true,
        listDetails: (entry) => [entry.group, `plan ${readOrder(entry)}`, readKind(entry), formatStatusLabel(readStatus(entry)), readDependency(entry)],
      };

      const SECTION_VIEWS = {
        handoffs: {
          noun: "handoff",
          describeLink: (entry) => ({ label: entry.title }),
          listDetails: (entry) => [
            entry.fields.focus && `focus: ${entry.fields.focus}`,
            /^\d/.test(entry.name) && `/handoff resume ${parseInt(entry.name, 10)}`,
          ],
        },
        "project-notes": {
          noun: "note",
          describeLink: (entry) => ({ label: entry.title }),
          listDetails: (entry) => [entry.group],
        },
        "small-plans": { ...PLAN_VIEW, hasEditableSets: true },
        brainstorm: { ...PLAN_VIEW, deleteWarning: "Its step files go with it." },
        tokens: {
          noun: "project",
          isReadOnly: true,
          describeLink: (entry) => ({
            label: entry.title,
            caption: `${Number(entry.fields.total_tokens).toLocaleString()} tokens · ${entry.fields.sessions} sessions`,
          }),
          listDetails: (entry) => [`${entry.fields.sessions} sessions`],
        },
      };

      const setMenuOpen = (isOpen) => {
        document.body.dataset.menu = isOpen ? "open" : "closed";
        menuButton.setAttribute("aria-expanded", String(isOpen));
        menuButton.setAttribute("aria-label", isOpen ? "Close Notes List" : "Open Notes List");
        sidebar.inert = narrowScreen.matches && !isOpen;
        backdrop.hidden = !isOpen;
        if (isOpen) (sidebar.querySelector("[aria-current='page']") ?? sidebar.querySelector("a"))?.focus();
      };

      const createSectionLinks = (selectedSection) => {
        const sectionLinks = createElement("div", "", "sections");
        sections.forEach((section) => {
          const link = createElement("a", section.title);
          link.href = `#${section.id}`;
          link.append(createElement("span", String(section.entries.length), "count"));
          if (section === selectedSection) link.setAttribute("aria-current", "true");
          sectionLinks.append(link);
        });
        return sectionLinks;
      };

      const createEntryLink = (section, entry, selectedEntry) => {
        const { label, caption, status } = SECTION_VIEWS[section.id].describeLink(entry);
        const link = createElement("a", formatDisplayName(label));
        link.href = `#${section.id}/${encodeURIComponent(entry.path)}`;
        link.title = formatDisplayName(entry.title);
        if (status) link.dataset.status = status;
        if (caption) link.append(createElement("small", formatDisplayName(caption)));
        if (entry.fields.share) {
          const shareBar = createElement("span", "", "progress-bar");
          shareBar.setAttribute("aria-hidden", "true");
          shareBar.style.setProperty("--progress", entry.fields.share);
          link.append(shareBar);
        }
        if (entry === selectedEntry) link.setAttribute("aria-current", "page");
        return link;
      };

      const createProgress = (section, entry) => {
        const entriesOfGroup = listGroupEntries(section, entry);
        const doneCount = entriesOfGroup.filter((member) => readStatus(member) === "done").length;
        const isComplete = doneCount === entriesOfGroup.length;
        const progress = createElement("span", "", "progress");
        const progressBar = createElement("span", "", "progress-bar");
        progressBar.setAttribute("aria-hidden", "true");
        progressBar.style.setProperty("--progress", String(doneCount / entriesOfGroup.length));
        progress.append(progressBar, isComplete ? `all ${doneCount} done ✦` : `${doneCount} of ${entriesOfGroup.length} done`);
        if (isComplete) progress.dataset.complete = "";
        return progress;
      };

      const buildProjectKey = (section, entry) => `${section.id}/${entry.project}`;

      const buildGroupKey = (section, entry) => `${buildProjectKey(section, entry)}/${entry.group}`;

      const createCollapseHeading = (tagName, text, key) => {
        const heading = createElement(tagName);
        const toggle = createElement("button", "", "collapse-toggle");
        toggle.type = "button";
        toggle.dataset.key = key;
        toggle.title = text;
        toggle.append(createIcon("chevron"), createElement("span", text), createElement("span", "", "count"));
        toggle.addEventListener("click", () => {
          if (!collapsedKeys.delete(key)) collapsedKeys.add(key);
          saveCollapsedKeys();
          applySidebarVisibility();
        });
        heading.append(toggle);
        return heading;
      };

      const filterInput = createElement("input", "", "note-filter");
      filterInput.type = "search";
      filterInput.id = "note-filter";
      filterInput.placeholder = "Filter…";
      filterInput.autocomplete = "off";
      filterInput.spellcheck = false;
      filterInput.setAttribute("aria-label", "Filter notes");

      const applySidebarVisibility = () => {
        const query = filterInput.value.trim().toLowerCase();
        const isFiltering = query !== "";
        const links = [...sidebar.querySelectorAll("a[data-project]")];
        links.forEach((link) => {
          const isCollapsed = collapsedKeys.has(link.dataset.project) || collapsedKeys.has(link.dataset.group);
          link.hidden = isFiltering
            ? !link.textContent.toLowerCase().includes(query)
            : isCollapsed;
        });
        sidebar.querySelectorAll(".collapse-toggle").forEach((toggle) => {
          const key = toggle.dataset.key;
          const heading = toggle.closest(".group-heading");
          const members = links.filter((link) => link.dataset.project === key || link.dataset.group === key);
          const hasVisibleMember = members.some((link) => !link.hidden);
          const hiddenCount = members.filter((link) => link.hidden).length;
          const isCollapsed = collapsedKeys.has(key);
          const isProjectCollapsed = collapsedKeys.has(heading.dataset.project);
          const countBadge = toggle.querySelector(".count");
          toggle.setAttribute("aria-expanded", String(!isCollapsed || isFiltering));
          countBadge.textContent = String(members.length - (isFiltering ? hiddenCount : 0));
          heading.hidden = isFiltering ? !hasVisibleMember : isProjectCollapsed;
        });
        sidebar.querySelector(".no-matches").hidden = !isFiltering || links.some((link) => !link.hidden);
      };

      const createGroupHeading = (section, entry) => {
        const view = SECTION_VIEWS[section.id];
        const groupHeading = createElement("div", "", "group-heading");
        groupHeading.dataset.project = buildProjectKey(section, entry);
        groupHeading.append(createCollapseHeading("h3", entry.group, buildGroupKey(section, entry)));
        if (view.hasEditableSets) {
          const actions = createElement("div", "", "group-actions");
          actions.append(
            createIconButton(`Add a plan to ${entry.group}`, "plus", "add", () => openAddPlan(section, entry)),
            createIconButton(`Delete set ${entry.group}`, "trash", "delete", () => deleteGroup(section, entry))
          );
          groupHeading.append(actions);
        }
        if (view.hasProgress) groupHeading.append(createProgress(section, entry));
        return groupHeading;
      };

      const createProjectHeading = (section, project) => {
        const projectHeading = createElement("div", "", "group-heading project-heading");
        const actions = createElement("div", "", "group-actions");
        actions.append(createIconButton(`Rename project ${project}`, "pencil", "rename", () => openRenameProject(project)));
        projectHeading.append(createCollapseHeading("h2", project, buildProjectKey(section, { project })), actions);
        return projectHeading;
      };

      const createSidebarHeader = () => {
        const header = createElement("div", "", "sidebar-header");
        const brand = createElement("div", "", "brand");
        brand.setAttribute("translate", "no");
        const mark = createElement("span", "", "mark");
        mark.setAttribute("aria-hidden", "true");
        brand.append(mark, "Claude notes");
        header.append(brand, createElement("p", greetByHour(), "greeting"));
        return header;
      };

      const createSidebarTop = (selectedSection) => {
        const top = createElement("div", "", "sidebar-top");
        const filterField = createElement("div", "", "filter-field");
        filterField.append(filterInput);
        top.append(createSidebarHeader(), createSectionLinks(selectedSection), filterField);
        return top;
      };

      const renderSidebar = (selectedSection, selectedEntry) => {
        const scrollPosition = sidebar.scrollTop;
        const hadFocus = document.activeElement === filterInput;
        const { selectionStart, selectionEnd } = filterInput;
        sidebar.replaceChildren(createSidebarTop(selectedSection));
        const entries = selectedSection?.entries ?? [];
        entries.forEach((entry, entryIndex) => {
          const previousEntry = entries[entryIndex - 1] ?? {};
          const isNewProject = entry.project !== previousEntry.project;
          if (isNewProject && !SECTION_VIEWS[selectedSection.id].isReadOnly) sidebar.append(createProjectHeading(selectedSection, entry.project));
          if (entry.group && (isNewProject || entry.group !== previousEntry.group)) sidebar.append(createGroupHeading(selectedSection, entry));
          const link = createEntryLink(selectedSection, entry, selectedEntry);
          link.dataset.project = buildProjectKey(selectedSection, entry);
          if (entry.group) link.dataset.group = buildGroupKey(selectedSection, entry);
          link.dataset.depth = SECTION_VIEWS[selectedSection.id].isReadOnly ? "0" : entry.group ? "2" : "1";
          sidebar.append(link);
        });
        sidebar.append(createElement("p", "No matching notes", "no-matches"));
        applySidebarVisibility();
        if (hadFocus) {
          filterInput.focus();
          filterInput.setSelectionRange(selectionStart, selectionEnd);
        }
        sidebar.scrollTop = scrollPosition;
      };

      const createDetailList = (selectedSection, selectedEntry) => {
        const detailList = createElement("ul", "", "entry-details");
        detailList.setAttribute("aria-label", "Note details");
        [
          selectedEntry.project,
          ...SECTION_VIEWS[selectedSection.id].listDetails(selectedEntry),
          formatCreated(selectedEntry.created),
          selectedEntry.path,
        ]
          .filter(Boolean)
          .forEach((detail) => detailList.append(createElement("li", detail)));
        return detailList;
      };

      const createEmptyState = (sectionId) => {
        const [headline, hint] = EMPTY_HINTS[sectionId] ?? ["Nothing here yet", "Fresh page, fresh start."];
        const empty = createElement("div", "", "empty");
        const emptyMark = createElement("span", "✎", "empty-mark");
        emptyMark.setAttribute("aria-hidden", "true");
        empty.append(emptyMark, createElement("strong", headline), hint);
        return empty;
      };

      const createEntryHeader = (selectedSection, selectedEntry) => {
        const noun = SECTION_VIEWS[selectedSection.id].noun;
        const capitalNoun = noun[0].toUpperCase() + noun.slice(1);
        const header = createElement("div", "", "entry-header");
        const actions = createElement("div", "", "entry-actions");
        if (!SECTION_VIEWS[selectedSection.id].isReadOnly) {
          actions.append(
            createButton(`Edit ${capitalNoun}`, "pencil", "button", () => startEditing(selectedSection, selectedEntry)),
            createButton(`Delete ${capitalNoun}`, "trash", "button quiet-danger", () => deleteEntry(selectedSection, selectedEntry))
          );
        }
        const titleToggle = createElement("button", "", "collapse-toggle entry-title-toggle");
        titleToggle.type = "button";
        titleToggle.setAttribute("aria-expanded", "true");
        titleToggle.append(createIcon("chevron"), createElement("span", formatDisplayName(selectedEntry.title)));
        const title = createElement("h1");
        title.append(titleToggle);
        header.append(title, actions);
        return header;
      };

      const wrapEntrySections = (body) => {
        for (let level = 6; level >= 2; level--) {
          const stopsSection = new RegExp(`^H[1-${level}]$`);
          body.querySelectorAll(`:scope > h${level}`).forEach((heading) => {
            const entrySection = createElement("details", "", "entry-section");
            entrySection.open = true;
            const summary = createElement("summary");
            heading.before(entrySection);
            summary.append(heading);
            entrySection.append(summary);
            while (entrySection.nextElementSibling && !stopsSection.test(entrySection.nextElementSibling.tagName)) {
              entrySection.append(entrySection.nextElementSibling);
            }
          });
        }
      };

      const wideScreen = matchMedia("(min-width: 1420px)");
      let tocObserver = null;
      let isTocScrolling = false;
      let tocScrollTimer = 0;

      wideScreen.addEventListener("change", () => {
        const disclosure = document.querySelector(".toc details");
        if (disclosure) disclosure.open = wideScreen.matches;
      });

      const assignHeadingIds = (body) => {
        const usedIds = new Set();
        body.querySelectorAll("h1, h2, h3, h4, h5, h6").forEach((heading) => {
          const baseSlug = heading.textContent.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-+|-+$/g, "") || "section";
          let slug = `section-${baseSlug}`;
          for (let suffix = 2; usedIds.has(slug); suffix++) slug = `section-${baseSlug}-${suffix}`;
          usedIds.add(slug);
          heading.id = slug;
        });
      };

      const revealHeading = (heading, titleToggle) => {
        if (titleToggle.getAttribute("aria-expanded") === "false") titleToggle.click();
        for (let section = heading.closest("details"); section; section = section.parentElement.closest("details")) {
          section.open = true;
        }
        isTocScrolling = true;
        clearTimeout(tocScrollTimer);
        tocScrollTimer = setTimeout(() => (isTocScrolling = false), 1200);
        entryArea.addEventListener("scrollend", () => (isTocScrolling = false), { once: true });
        heading.scrollIntoView({ behavior: "smooth", block: "start" });
      };

      const createContents = (body, titleToggle) => {
        const headings = [...body.querySelectorAll("h2, h3")];
        tocObserver?.disconnect();
        if (headings.length < 2) return null;
        const contents = createElement("div", "", "toc");
        contents.setAttribute("role", "navigation");
        contents.setAttribute("aria-label", "Contents");
        const disclosure = createElement("details");
        disclosure.open = wideScreen.matches;
        disclosure.append(createElement("summary", "Contents"));
        const list = createElement("ul");
        const linksById = new Map();
        const markCurrent = (headingId) => {
          linksById.forEach((link) => link.removeAttribute("aria-current"));
          linksById.get(headingId).setAttribute("aria-current", "true");
        };
        headings.forEach((heading) => {
          const item = createElement("li", "", heading.tagName === "H3" ? "toc-nested" : "");
          const link = createElement("a", formatDisplayName(heading.textContent));
          link.href = `#${heading.id}`;
          link.addEventListener("click", (event) => {
            event.preventDefault();
            markCurrent(heading.id);
            revealHeading(heading, titleToggle);
          });
          linksById.set(heading.id, link);
          item.append(link);
          list.append(item);
        });
        disclosure.append(list);
        contents.append(disclosure);
        tocObserver = new IntersectionObserver(
          (observed) => {
            const visible = observed.filter((observation) => observation.isIntersecting);
            if (visible.length === 0 || isTocScrolling) return;
            markCurrent(visible[0].target.id);
          },
          { root: entryArea, rootMargin: "0px 0px -75% 0px" }
        );
        headings.forEach((heading) => tocObserver.observe(heading));
        return contents;
      };

      const renderEntry = (selectedSection, selectedEntry) => {
        if (!selectedEntry) {
          entryArea.replaceChildren(createEmptyState(selectedSection?.id));
          return;
        }
        const article = createElement("article");
        const body = createElement("div", "", "entry-body");
        body.innerHTML = selectedEntry.html;
        body.querySelectorAll("input[type=checkbox]").forEach((checkbox) => (checkbox.disabled = true));
        const header = createEntryHeader(selectedSection, selectedEntry);
        const detailList = createDetailList(selectedSection, selectedEntry);
        const titleToggle = header.querySelector(".entry-title-toggle");
        titleToggle.addEventListener("click", () => {
          const isExpanded = titleToggle.getAttribute("aria-expanded") === "true";
          titleToggle.setAttribute("aria-expanded", String(!isExpanded));
          detailList.hidden = isExpanded;
          body.hidden = isExpanded;
        });
        assignHeadingIds(body);
        wrapEntrySections(body);
        const contents = createContents(body, titleToggle);
        const entrySections = [...body.querySelectorAll(".entry-section")];
        if (entrySections.length >= 2) {
          const describeToggle = () => (entrySections.some((entrySection) => entrySection.open) ? "Collapse All" : "Expand All");
          const toggleAll = createButton(describeToggle(), "", "button", () => {
            const shouldOpen = !entrySections.some((entrySection) => entrySection.open);
            entrySections.forEach((entrySection) => (entrySection.open = shouldOpen));
          });
          entrySections.forEach((entrySection) =>
            entrySection.addEventListener("toggle", () => (toggleAll.textContent = describeToggle()))
          );
          header.querySelector(".entry-actions").prepend(toggleAll);
        }
        article.append(header, detailList, ...(contents ? [contents] : []), body);
        entryArea.replaceChildren(article);
      };

      const render = () => {
        const { section, entry } = readSelection();
        document.title = entry ? `${formatDisplayName(entry.title)} · ${section.title}` : "Claude notes";
        renderSidebar(section, entry);
        if (!openEditor) renderEntry(section, entry);
      };

      const loadSections = async () => {
        try {
          const [noteSections, tokenSection] = await Promise.all(
            ["/api/sections", "/api/tokens"].map(async (url) => (await fetch(url)).json())
          );
          sections = [...noteSections, tokenSection];
        } catch (error) {
          entryArea.replaceChildren(createElement("p", "Can’t reach the notes server. Run claude-notes again, then reload this page.", "empty"));
          return;
        }
        render();
        entryArea.removeAttribute("aria-busy");
      };

      const hasUnsavedChanges = () => openEditor !== null && openEditor.textarea.value !== openEditor.entry.source;

      const confirmDiscard = () =>
        !hasUnsavedChanges() ||
        askToConfirm({
          title: "Discard your changes?",
          message: `Your edits to “${openEditor.entry.title}” haven’t been saved.`,
          confirmLabel: "Discard Changes",
        });

      const stopEditing = () => {
        openEditor = null;
        render();
        entryArea.focus();
      };

      const FRONT_MATTER_PROJECT = /^(---\n(?:(?!---\n).*\n)*?)project: ([^\n]*)/;

      const readProjectLine = (text) => text.match(FRONT_MATTER_PROJECT)?.[2].trim();

      const replaceProjectLine = (text, project) => text.replace(FRONT_MATTER_PROJECT, (match, frontMatterStart) => `${frontMatterStart}project: ${project}`);

      const createProjectField = (selectedSection, selectedEntry, textarea) => {
        if (selectedSection.id === "brainstorm") return { elements: [], readProject: () => selectedEntry.project };
        const projectLabel = createElement("label", "Project");
        projectLabel.htmlFor = "note-project";
        const projectInput = createElement("input");
        projectInput.id = "note-project";
        projectInput.name = "project";
        projectInput.autocomplete = "off";
        projectInput.spellcheck = false;
        projectInput.required = true;
        projectInput.value = selectedEntry.project;
        projectInput.setAttribute("list", "project-options");
        projectInput.setAttribute("aria-describedby", "project-hint");
        const projectHint = createElement("p", `Change it to move this ${SECTION_VIEWS[selectedSection.id].noun} under another project.`, "editor-hint");
        projectHint.id = "project-hint";
        const projectOptions = createElement("datalist");
        projectOptions.id = "project-options";
        [...new Set(sections.flatMap((section) => section.entries.map((entry) => entry.project)))].sort().forEach((project) => {
          const option = createElement("option");
          option.value = project;
          projectOptions.append(option);
        });
        projectInput.addEventListener("input", () => (textarea.value = replaceProjectLine(textarea.value, projectInput.value.trim())));
        textarea.addEventListener("input", () => {
          const project = readProjectLine(textarea.value);
          if (project !== undefined) projectInput.value = project;
        });
        return { elements: [projectLabel, projectInput, projectOptions, projectHint], readProject: () => projectInput.value.trim() };
      };

      const startEditing = (selectedSection, selectedEntry) => {
        const article = createElement("article");
        const header = createElement("div", "", "entry-header");
        header.append(createElement("h1", formatDisplayName(selectedEntry.title)));
        const form = createElement("form", "", "editor");
        form.setAttribute("aria-label", `Edit ${selectedEntry.title}`);
        const label = createElement("label", "Markdown ");
        label.htmlFor = "note-source";
        label.append(createElement("code", selectedEntry.path));
        const textarea = createElement("textarea");
        textarea.id = "note-source";
        textarea.name = "source";
        textarea.autocomplete = "off";
        textarea.value = selectedEntry.source;
        const failure = createElement("p", "", "field-error");
        failure.setAttribute("role", "alert");
        failure.hidden = true;
        const hint = createElement("p", "", "editor-hint");
        hint.innerHTML = "<kbd>⌘</kbd>&nbsp;/&nbsp;<kbd>Ctrl</kbd>&nbsp;+&nbsp;<kbd>Enter</kbd> saves · <kbd>Esc</kbd> cancels";
        const saveButton = createElement("button", "", "button primary");
        saveButton.type = "submit";
        saveButton.append(createIcon("check"), "Save Changes");
        const cancelButton = createButton("Cancel", "", "button", async () => {
          if (await confirmDiscard()) stopEditing();
        });
        const buttons = createElement("div", "", "editor-buttons");
        buttons.append(cancelButton, saveButton);
        const footer = createElement("div", "", "editor-footer");
        footer.append(hint, buttons);
        const projectField = createProjectField(selectedSection, selectedEntry, textarea);
        form.append(...projectField.elements, label, textarea, failure, footer);

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          saveButton.disabled = true;
          saveButton.lastChild.textContent = "Saving…";
          failure.hidden = true;
          try {
            const newProject = projectField.readProject();
            const isMove = newProject !== selectedEntry.project;
            const moveQuery = isMove ? `?project=${encodeURIComponent(newProject)}` : "";
            const response = await sendChange("PUT", buildNoteUrl(selectedSection.id, selectedEntry.path) + moveQuery, textarea.value);
            openEditor = null;
            if (response.status === 200) {
              const { path } = await response.json();
              history.replaceState(null, "", `#${selectedSection.id}/${encodeURIComponent(path)}`);
            }
            await loadSections();
            entryArea.focus();
            showToast(isMove ? `Moved to ${newProject}. New home, same note.` : pickOne(SAVED_MESSAGES));
          } catch (error) {
            failure.textContent = describeFailure("save", error);
            failure.hidden = false;
            saveButton.disabled = false;
            saveButton.lastChild.textContent = "Save Changes";
          }
        });
        textarea.addEventListener("keydown", async (event) => {
          if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
            event.preventDefault();
            form.requestSubmit();
          }
          if (event.key === "Escape") {
            event.preventDefault();
            if (await confirmDiscard()) stopEditing();
          }
        });

        article.append(header, form);
        entryArea.replaceChildren(article);
        openEditor = { entry: selectedEntry, hash: location.hash, textarea };
        textarea.focus();
        textarea.setSelectionRange(0, 0);
        textarea.scrollTop = 0;
      };

      const deleteEntry = async (selectedSection, selectedEntry) => {
        const view = SECTION_VIEWS[selectedSection.id];
        const capitalNoun = view.noun[0].toUpperCase() + view.noun.slice(1);
        const isConfirmed = await askToConfirm({
          title: `Delete “${selectedEntry.title}”?`,
          message: [`This ${view.noun} will be gone for good.`, view.deleteWarning, "No undo, no take-backsies."].filter(Boolean).join(" "),
          confirmLabel: `Delete ${capitalNoun}`,
        });
        if (!isConfirmed) return;
        try {
          await sendChange("DELETE", buildNoteUrl(selectedSection.id, selectedEntry.path));
        } catch (error) {
          showToast(describeFailure("delete", error), "error");
          return;
        }
        showToast(pickOne(DELETED_MESSAGES));
        history.replaceState(null, "", `#${selectedSection.id}`);
        await loadSections();
        entryArea.focus();
      };

      const deleteGroup = async (section, memberEntry) => {
        const planCount = listGroupEntries(section, memberEntry).length;
        const isConfirmed = await askToConfirm({
          title: `Delete the set “${memberEntry.group}”?`,
          message: `${planCount === 1 ? "The only plan" : `All ${planCount} plans`} in this set will be deleted for good. No undo, no take-backsies.`,
          confirmLabel: `Delete ${planCount} ${planCount === 1 ? "Plan" : "Plans"}`,
        });
        if (!isConfirmed) return;
        try {
          await sendChange("DELETE", buildGroupUrl(section.id, memberEntry.project, memberEntry.group));
        } catch (error) {
          showToast(describeFailure("delete the set", error), "error");
          return;
        }
        showToast(pickOne(DELETED_MESSAGES));
        history.replaceState(null, "", `#${section.id}`);
        await loadSections();
        sidebar.querySelector(".sections [aria-current]")?.focus();
      };

      const slugify = (title) =>
        title
          .toLowerCase()
          .normalize("NFKD")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 48)
          .replace(/-+$/, "") || "plan";

      const buildPlanText = (title, memberEntry, order) =>
        [
          "---",
          `title: ${title}`,
          `project: ${memberEntry.project}`,
          "kind: feature",
          "status: pending",
          `created: ${new Date().toISOString()}`,
          `set: ${memberEntry.group}`,
          `order: ${order}`,
          "---",
          "",
          "## Goal",
          "",
          "Describe what is true when this plan is done.",
          "",
          "## Context",
          "",
          "Name the files, functions and decisions the implementer needs.",
          "",
          "## Steps",
          "",
          "1. Name the first edit: the file, the place and what to write.",
          "",
          "## Check",
          "",
          "- Run: `<command>`",
          "- Expect: <what the output shows when the plan worked>",
          "",
          "## Review",
          "",
          "- <a fact the reviewer confirms in the diff>",
          "",
        ].join("\n");

      let addPlanTarget = null;

      const openAddPlan = (section, memberEntry) => {
        addPlanTarget = { section, memberEntry };
        addPlanForm.reset();
        addPlanDialog.querySelector("#add-plan-error").hidden = true;
        addPlanDialog.querySelector("#add-plan-set").textContent = `It joins the set ${memberEntry.group} as the next plan in line.`;
        addPlanDialog.showModal();
        addPlanDialog.querySelector("#plan-title").focus();
      };

      addPlanDialog.querySelector("#add-plan-cancel").addEventListener("click", () => addPlanDialog.close());

      addPlanForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const { section, memberEntry } = addPlanTarget;
        const title = addPlanForm.elements.title.value.trim();
        const errorMessage = addPlanDialog.querySelector("#add-plan-error");
        const addButton = addPlanDialog.querySelector("#add-plan-button");
        if (!title) {
          errorMessage.textContent = "Give the plan a title first.";
          errorMessage.hidden = false;
          addPlanForm.elements.title.focus();
          return;
        }
        const highestOrder = Math.max(0, ...listGroupEntries(section, memberEntry).map((entry) => parseInt(readOrder(entry), 10) || 0));
        const order = highestOrder + 1;
        const entryPath = `${memberEntry.project}/${memberEntry.group}/${String(order).padStart(2, "0")}-${slugify(title)}.md`;
        addButton.disabled = true;
        addButton.textContent = "Adding…";
        try {
          await sendChange("POST", buildNoteUrl(section.id, entryPath), buildPlanText(title, memberEntry, order));
        } catch (error) {
          errorMessage.textContent = describeFailure("add the plan", error);
          errorMessage.hidden = false;
          return;
        } finally {
          addButton.disabled = false;
          addButton.textContent = "Add Plan";
        }
        addPlanDialog.close();
        history.replaceState(null, "", `#${section.id}/${encodeURIComponent(entryPath)}`);
        await loadSections();
        showToast(pickOne(ADDED_MESSAGES));
        const { section: newSection, entry: newEntry } = readSelection();
        if (newEntry?.path === entryPath) startEditing(newSection, newEntry);
      });

      const PROJECT_NAME_PATTERN = /^[A-Za-z0-9][A-Za-z0-9._-]*$/;
      let renameProjectTarget = null;

      const openRenameProject = (project) => {
        renameProjectTarget = project;
        renameProjectForm.reset();
        renameProjectForm.elements.name.value = project;
        renameProjectDialog.querySelector("#rename-project-error").hidden = true;
        renameProjectDialog.querySelector("#rename-project-scope").textContent = `Renames the ${project} folder in every section and rewrites the project: line of each note inside.`;
        renameProjectDialog.showModal();
        renameProjectForm.elements.name.select();
      };

      const describeProjectNameProblem = (newProject, project) => {
        if (!newProject) return "Give the project a name first.";
        if (newProject === project) return "That’s the name it already has.";
        if (!PROJECT_NAME_PATTERN.test(newProject)) return "Start with a letter or digit, then use only letters, digits, dots, dashes and underscores.";
        if (openEditor) return "Save or cancel the note you’re editing first.";
        return "";
      };

      const replaceHashProject = (project, newProject) => {
        const [sectionId, ...pathSegments] = decodeURIComponent(location.hash.slice(1)).split("/");
        if (pathSegments[0] !== project) return;
        history.replaceState(null, "", `#${sectionId}/${encodeURIComponent([newProject, ...pathSegments.slice(1)].join("/"))}`);
      };

      renameProjectDialog.querySelector("#rename-project-cancel").addEventListener("click", () => renameProjectDialog.close());

      renameProjectForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const project = renameProjectTarget;
        const newProject = renameProjectForm.elements.name.value.trim();
        const errorMessage = renameProjectDialog.querySelector("#rename-project-error");
        const renameButton = renameProjectDialog.querySelector("#rename-project-button");
        const problem = describeProjectNameProblem(newProject, project);
        if (problem) {
          errorMessage.textContent = problem;
          errorMessage.hidden = false;
          renameProjectForm.elements.name.focus();
          return;
        }
        renameButton.disabled = true;
        renameButton.textContent = "Renaming…";
        try {
          await sendChange("POST", `/api/projects/${encodeURIComponent(project)}/rename?to=${encodeURIComponent(newProject)}`);
        } catch (error) {
          errorMessage.textContent = describeFailure("rename the project", error);
          errorMessage.hidden = false;
          return;
        } finally {
          renameButton.disabled = false;
          renameButton.textContent = "Rename";
        }
        renameProjectDialog.close();
        replaceHashProject(project, newProject);
        await loadSections();
        showToast(`Renamed ${project} to ${newProject}.`);
      });

      document.querySelector(".skip-link").addEventListener("click", (event) => {
        event.preventDefault();
        entryArea.focus();
      });

      menuButton.addEventListener("click", () => setMenuOpen(document.body.dataset.menu !== "open"));
      backdrop.addEventListener("click", () => setMenuOpen(false));
      narrowScreen.addEventListener("change", () => setMenuOpen(false));
      filterInput.addEventListener("input", applySidebarVisibility);
      filterInput.addEventListener("keydown", (event) => {
        if (event.key !== "Escape" || !filterInput.value) return;
        event.stopPropagation();
        filterInput.value = "";
        applySidebarVisibility();
      });
      document.addEventListener("keydown", (event) => {
        const isTyping = event.target.closest("input, textarea, select, [contenteditable]");
        if (event.key === "/" && !isTyping && !event.metaKey && !event.ctrlKey && !event.altKey) {
          event.preventDefault();
          if (narrowScreen.matches) setMenuOpen(true);
          filterInput.focus();
        }
        if (event.key === "Escape" && document.body.dataset.menu === "open") {
          setMenuOpen(false);
          menuButton.focus();
        }
      });

      addEventListener("hashchange", async () => {
        if (openEditor) {
          const newHash = location.hash;
          if (!(await confirmDiscard())) {
            history.replaceState(null, "", openEditor.hash);
            render();
            return;
          }
          openEditor = null;
          history.replaceState(null, "", newHash);
        }
        if (narrowScreen.matches) setMenuOpen(false);
        render();
        entryArea.scrollTop = 0;
        entryArea.focus();
      });
      addEventListener("beforeunload", (event) => {
        if (hasUnsavedChanges()) event.preventDefault();
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && !openEditor) loadSections();
      });
      setMenuOpen(false);
      loadSections();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Handoffs</title>
    <style>
      :root {
        --background: #ffffff;
        --sidebar: #fafafa;
        --hover: #f2f2f2;
        --selected: #ebebeb;
        --text: #171717;
        --muted: #666666;
        --border: #eaeaea;
        --border-strong: #d4d4d4;
        --focus: #0070f3;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0a0a0a;
          --sidebar: #000000;
          --hover: #1a1a1a;
          --selected: #242424;
          --text: #ededed;
          --muted: #a1a1a1;
          --border: #262626;
          --border-strong: #3d3d3d;
          --focus: #3291ff;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        height: 100vh;
        font:
          14px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background: var(--background);
      }
      nav {
        overflow-y: auto;
        padding: 16px 8px;
        background: var(--sidebar);
        border-right: 1px solid var(--border);
      }
      nav h1 {
        margin: 0 8px 12px;
        font-size: 14px;
      }
      nav h2 {
        margin: 16px 8px 2px;
        font-size: 13px;
      }
      nav h3 {
        margin: 8px 8px 2px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      nav a {
        display: block;
        padding: 4px 8px;
        border-radius: 6px;
        color: inherit;
        text-decoration: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      nav a:hover {
        background: var(--hover);
      }
      nav a[aria-current="page"] {
        background: var(--selected);
        font-weight: 500;
      }
      :is(a, main):focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
      }
      main {
        overflow-y: auto;
        padding: 32px 40px 64px;
      }
      article {
        max-width: 760px;
      }
      article > h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.3;
      }
      .handoff-details {
        margin: 4px 0 24px;
        font-size: 12px;
        color: var(--muted);
      }
      .empty {
        color: var(--muted);
      }
      .handoff-body :is(h1, h2, h3, h4, h5, h6) {
        margin: 28px 0 8px;
        line-height: 1.3;
      }
      .handoff-body h1 {
        font-size: 20px;
      }
      .handoff-body h2 {
        font-size: 17px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--border);
      }
      .handoff-body :is(h3, h4, h5, h6) {
        font-size: 14px;
      }
      .handoff-body :is(p, ul, ol, pre, blockquote, table) {
        margin: 0 0 12px;
      }
      .handoff-body :is(ul, ol) {
        padding-left: 24px;
      }
      .handoff-body li:has(> input[type="checkbox"]) {
        list-style: none;
        margin-left: -24px;
      }
      .handoff-body input[type="checkbox"] {
        margin: 0 6px 0 0;
        accent-color: var(--focus);
      }
      .handoff-body code {
        font:
          0.9em ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        padding: 1px 4px;
        border-radius: 4px;
        background: var(--hover);
      }
      .handoff-body pre {
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--sidebar);
        overflow-x: auto;
      }
      .handoff-body pre code {
        padding: 0;
        background: none;
      }
      .handoff-body a {
        color: var(--focus);
      }
      .handoff-body blockquote {
        padding-left: 12px;
        border-left: 3px solid var(--border-strong);
        color: var(--muted);
      }
      .handoff-body table {
        display: block;
        overflow-x: auto;
        border-collapse: collapse;
      }
      .handoff-body :is(th, td) {
        padding: 4px 10px;
        border: 1px solid var(--border);
        text-align: left;
      }
      .handoff-body hr {
        border: 0;
        border-top: 1px solid var(--border);
      }
      @media (max-width: 720px) {
        body {
          grid-template-columns: 1fr;
          grid-template-rows: 40vh 1fr;
        }
        nav {
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }
        main {
          padding: 20px 16px 48px;
        }
      }
    </style>
  </head>
  <body>
    <nav aria-label="All handoffs"></nav>
    <main tabindex="-1"></main>
    <script>
      const sidebar = document.querySelector("nav");
      const handoffArea = document.querySelector("main");
      let handoffs = [];

      const createElement = (tagName, text, className) => {
        const element = document.createElement(tagName);
        if (text) element.textContent = text;
        if (className) element.className = className;
        return element;
      };

      const readSelectedPath = () => decodeURIComponent(location.hash.slice(1));

      const findSelectedHandoff = () =>
        handoffs.find((handoff) => handoff.path === readSelectedPath()) ??
        handoffs[0];

      const renderSidebar = (selectedHandoff) => {
        sidebar.replaceChildren(createElement("h1", "Handoffs"));
        handoffs.forEach((handoff, handoffIndex) => {
          const previousHandoff = handoffs[handoffIndex - 1] ?? {};
          const isNewProject = handoff.project !== previousHandoff.project;
          if (isNewProject)
            sidebar.append(createElement("h2", handoff.project));
          const link = createElement("a", `#${handoff.id} ${handoff.title}`);
          link.href = `#${encodeURIComponent(handoff.path)}`;
          link.title = handoff.title;
          if (handoff === selectedHandoff)
            link.setAttribute("aria-current", "page");
          sidebar.append(link);
        });
      };

      const renderHandoff = (selectedHandoff) => {
        if (!selectedHandoff) {
          handoffArea.replaceChildren(
            createElement(
              "p",
              "No handoffs yet. Run /handoff in a session to write one.",
              "empty"
            )
          );
          return;
        }
        const article = createElement("article");
        const body = createElement("div", "", "handoff-body");
        body.innerHTML = selectedHandoff.html;
        body
          .querySelectorAll("input[type=checkbox]")
          .forEach((checkbox) => (checkbox.disabled = true));
        article.append(
          createElement("h1", selectedHandoff.title),
          createElement(
            "p",
            [
              selectedHandoff.project,
              selectedHandoff.created.slice(0, 16).replace("T", " "),
              selectedHandoff.focus && `focus: ${selectedHandoff.focus}`,
              `in ${selectedHandoff.project}, run /handoff resume ${selectedHandoff.id}`,
            ]
              .filter(Boolean)
              .join(" · "),
            "handoff-details"
          ),
          body
        );
        handoffArea.replaceChildren(article);
      };

      const render = () => {
        const selectedHandoff = findSelectedHandoff();
        document.title = selectedHandoff
          ? `${selectedHandoff.title} · Handoffs`
          : "Handoffs";
        renderSidebar(selectedHandoff);
        renderHandoff(selectedHandoff);
      };

      const loadHandoffs = async () => {
        handoffs = await (await fetch("/api/handoffs")).json();
        render();
      };

      addEventListener("hashchange", () => {
        render();
        handoffArea.scrollTop = 0;
        handoffArea.focus();
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) loadHandoffs();
      });
      loadHandoffs();
    </script>
  </body>
</html>

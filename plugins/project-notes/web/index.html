<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project notes</title>
    <style>
      :root {
        --background: #ffffff;
        --sidebar: #fafafa;
        --hover: #f2f2f2;
        --selected: #ebebeb;
        --text: #171717;
        --muted: #666666;
        --border: #eaeaea;
        --border-strong: #d4d4d4;
        --focus: #0070f3;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0a0a0a;
          --sidebar: #000000;
          --hover: #1a1a1a;
          --selected: #242424;
          --text: #ededed;
          --muted: #a1a1a1;
          --border: #262626;
          --border-strong: #3d3d3d;
          --focus: #3291ff;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        height: 100vh;
        font:
          14px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background: var(--background);
      }
      nav {
        overflow-y: auto;
        padding: 16px 8px;
        background: var(--sidebar);
        border-right: 1px solid var(--border);
      }
      nav h1 {
        margin: 0 8px 12px;
        font-size: 14px;
      }
      nav h2 {
        margin: 16px 8px 2px;
        font-size: 13px;
      }
      nav h3 {
        margin: 8px 8px 2px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      nav a {
        display: block;
        padding: 4px 8px;
        border-radius: 6px;
        color: inherit;
        text-decoration: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      nav a:hover {
        background: var(--hover);
      }
      nav a[aria-current="page"] {
        background: var(--selected);
        font-weight: 500;
      }
      :is(a, main):focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
      }
      main {
        overflow-y: auto;
        padding: 32px 40px 64px;
      }
      article {
        max-width: 760px;
      }
      article > h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.3;
      }
      .note-details {
        margin: 4px 0 24px;
        font-size: 12px;
        color: var(--muted);
      }
      .empty {
        color: var(--muted);
      }
      .note-body :is(h1, h2, h3, h4, h5, h6) {
        margin: 28px 0 8px;
        line-height: 1.3;
      }
      .note-body h1 {
        font-size: 20px;
      }
      .note-body h2 {
        font-size: 17px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--border);
      }
      .note-body :is(h3, h4, h5, h6) {
        font-size: 14px;
      }
      .note-body :is(p, ul, ol, pre, blockquote, table) {
        margin: 0 0 12px;
      }
      .note-body :is(ul, ol) {
        padding-left: 24px;
      }
      .note-body li:has(> input[type="checkbox"]) {
        list-style: none;
        margin-left: -24px;
      }
      .note-body input[type="checkbox"] {
        margin: 0 6px 0 0;
        accent-color: var(--focus);
      }
      .note-body code {
        font:
          0.9em ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        padding: 1px 4px;
        border-radius: 4px;
        background: var(--hover);
      }
      .note-body pre {
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--sidebar);
        overflow-x: auto;
      }
      .note-body pre code {
        padding: 0;
        background: none;
      }
      .note-body a {
        color: var(--focus);
      }
      .note-body blockquote {
        padding-left: 12px;
        border-left: 3px solid var(--border-strong);
        color: var(--muted);
      }
      .note-body table {
        display: block;
        overflow-x: auto;
        border-collapse: collapse;
      }
      .note-body :is(th, td) {
        padding: 4px 10px;
        border: 1px solid var(--border);
        text-align: left;
      }
      .note-body hr {
        border: 0;
        border-top: 1px solid var(--border);
      }
      @media (max-width: 720px) {
        body {
          grid-template-columns: 1fr;
          grid-template-rows: 40vh 1fr;
        }
        nav {
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }
        main {
          padding: 20px 16px 48px;
        }
      }
    </style>
  </head>
  <body>
    <nav aria-label="All notes"></nav>
    <main tabindex="-1"></main>
    <script>
      const sidebar = document.querySelector("nav");
      const noteArea = document.querySelector("main");
      let notes = [];

      const createElement = (tagName, text, className) => {
        const element = document.createElement(tagName);
        if (text) element.textContent = text;
        if (className) element.className = className;
        return element;
      };

      const readSelectedPath = () => decodeURIComponent(location.hash.slice(1));

      const findSelectedNote = () =>
        notes.find((note) => note.path === readSelectedPath()) ?? notes[0];

      const renderSidebar = (selectedNote) => {
        sidebar.replaceChildren(createElement("h1", "Project notes"));
        notes.forEach((note, noteIndex) => {
          const previousNote = notes[noteIndex - 1] ?? {};
          const isNewProject = note.project !== previousNote.project;
          if (isNewProject) sidebar.append(createElement("h2", note.project));
          if (isNewProject || note.category !== previousNote.category)
            sidebar.append(createElement("h3", note.category));
          const link = createElement("a", note.title);
          link.href = `#${encodeURIComponent(note.path)}`;
          link.title = note.title;
          if (note === selectedNote) link.setAttribute("aria-current", "page");
          sidebar.append(link);
        });
      };

      const renderNote = (selectedNote) => {
        if (!selectedNote) {
          noteArea.replaceChildren(
            createElement(
              "p",
              "No project notes yet. Ask Claude to write one, or run /project-note.",
              "empty"
            )
          );
          return;
        }
        const article = createElement("article");
        const body = createElement("div", "", "note-body");
        body.innerHTML = selectedNote.html;
        body
          .querySelectorAll("input[type=checkbox]")
          .forEach((checkbox) => (checkbox.disabled = true));
        article.append(
          createElement("h1", selectedNote.title),
          createElement(
            "p",
            [
              selectedNote.project,
              selectedNote.category,
              selectedNote.created.slice(0, 16).replace("T", " "),
              selectedNote.path,
            ].join(" · "),
            "note-details"
          ),
          body
        );
        noteArea.replaceChildren(article);
      };

      const render = () => {
        const selectedNote = findSelectedNote();
        document.title = selectedNote
          ? `${selectedNote.title} · Project notes`
          : "Project notes";
        renderSidebar(selectedNote);
        renderNote(selectedNote);
      };

      const loadNotes = async () => {
        notes = await (await fetch("/api/notes")).json();
        render();
      };

      addEventListener("hashchange", () => {
        render();
        noteArea.scrollTop = 0;
        noteArea.focus();
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) loadNotes();
      });
      loadNotes();
    </script>
  </body>
</html>

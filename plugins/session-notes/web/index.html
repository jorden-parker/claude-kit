<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Session notes</title>
    <style>
      :root {
        --background: #f7f7f8;
        --surface: #ffffff;
        --text: #1d1d22;
        --muted: #6b6b76;
        --border: #e2e2e7;
        --accent: #c2338a;
        --heading: #1f6f9a;
        --danger: #c0392b;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #141417;
          --surface: #1d1d22;
          --text: #ececf1;
          --muted: #9a9aa6;
          --border: #2e2e36;
          --accent: #f07ac4;
          --heading: #6cc4f0;
          --danger: #ff7b6b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 820px;
        margin: 0 auto;
        padding: 24px 16px 64px;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        color: var(--accent);
      }
      input[type="search"] {
        flex: 1 1 220px;
        max-width: 320px;
        padding: 8px 10px;
        font: inherit;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .session {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .session-header {
        display: flex;
        gap: 8px;
        align-items: baseline;
        justify-content: space-between;
      }
      .session-title {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .note {
        border-top: 1px solid var(--border);
        margin-top: 12px;
        padding-top: 12px;
      }
      .note-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 13px;
      }
      .note-body {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin-top: 4px;
      }
      .note-heading {
        font-weight: 600;
        color: var(--heading);
      }
      .actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }
      button {
        font: inherit;
        font-size: 13px;
        padding: 4px 10px;
        cursor: pointer;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      button:hover {
        border-color: var(--muted);
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button.danger {
        color: var(--danger);
      }
      textarea {
        width: 100%;
        min-height: 140px;
        margin-top: 6px;
        padding: 8px;
        font:
          13px/1.5 ui-monospace,
          Menlo,
          monospace;
        color: var(--text);
        background: var(--background);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .status {
        color: var(--muted);
      }
      .error {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Session notes</h1>
        <input
          type="search"
          id="filter"
          placeholder="Filter notes"
          aria-label="Filter notes"
        />
      </header>
      <p id="message" class="status" role="status"></p>
      <div id="sessions"></div>
    </main>
    <script>
      const sessionsElement = document.getElementById("sessions");
      const messageElement = document.getElementById("message");
      const filterElement = document.getElementById("filter");
      let sessions = [];
      let editingKey = null;
      let confirmingKey = null;

      function createElement(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      }

      function createButton(label, onClick, className) {
        const button = createElement("button", className, label);
        button.type = "button";
        button.addEventListener("click", onClick);
        return button;
      }

      function showMessage(text, isError) {
        messageElement.textContent = text;
        messageElement.className = isError ? "error" : "status";
      }

      async function send(method, path, body) {
        const response = await fetch(path, {
          method,
          headers: { "Content-Type": "application/json" },
          body: body === undefined ? undefined : JSON.stringify(body),
        });
        if (!response.ok)
          throw new Error(
            (await response.text()).trim() || response.statusText
          );
      }

      async function loadSessions() {
        try {
          const response = await fetch("/api/sessions");
          if (!response.ok) throw new Error((await response.text()).trim());
          sessions = await response.json();
          if (!editingKey) render();
        } catch (error) {
          showMessage(
            error.message ||
              "Could not reach session-notes. Is it still running?",
            true
          );
        }
      }

      async function act(method, path, body, doneMessage) {
        try {
          await send(method, path, body);
          editingKey = null;
          confirmingKey = null;
          showMessage(doneMessage, false);
          await loadSessions();
        } catch (error) {
          showMessage(error.message, true);
        }
      }

      function renderConfirm(actions, key, label, path) {
        if (confirmingKey !== key) {
          actions.append(
            createButton(
              "Delete",
              () => {
                confirmingKey = key;
                render();
              },
              "danger"
            )
          );
          return;
        }
        actions.append(
          createElement("span", null, label + "?"),
          createButton(
            "Yes, delete",
            () => act("DELETE", path, undefined, "Deleted."),
            "danger"
          ),
          createButton("Keep", () => {
            confirmingKey = null;
            render();
          })
        );
      }

      function renderNote(session, note) {
        const key = session.number + "/" + note.number;
        const path =
          "/api/sessions/" + session.number + "/notes/" + note.number;
        const noteElement = createElement("article", "note");
        const header = createElement("div", "note-header");
        const actions = createElement("div", "actions");
        header.append(
          createElement("span", null, "Note " + note.number),
          actions
        );
        noteElement.append(header);

        if (editingKey === key) {
          const textarea = createElement("textarea");
          textarea.value = note.text;
          textarea.setAttribute("aria-label", "Note " + note.number + " text");
          actions.append(
            createButton("Save", () =>
              act("PUT", path, { text: textarea.value }, "Saved.")
            ),
            createButton("Cancel", () => {
              editingKey = null;
              render();
            })
          );
          noteElement.append(textarea);
          setTimeout(() => textarea.focus());
          return noteElement;
        }

        actions.append(
          createButton("Edit", () => {
            editingKey = key;
            confirmingKey = null;
            render();
          })
        );
        renderConfirm(actions, key, "Delete this note", path);
        const body = createElement("div", "note-body");
        for (const line of note.lines) {
          body.append(
            createElement(
              "div",
              line.isHeading ? "note-heading" : null,
              line.text || " "
            )
          );
        }
        noteElement.append(body);
        return noteElement;
      }

      function render() {
        const filterText = filterElement.value.trim().toLowerCase();
        sessionsElement.replaceChildren();
        let shownCount = 0;
        for (const session of sessions) {
          const isSessionMatch = session.title
            .toLowerCase()
            .includes(filterText);
          const notes = session.notes.filter(
            (note) =>
              isSessionMatch || note.text.toLowerCase().includes(filterText)
          );
          if (notes.length === 0) continue;
          shownCount++;
          const sessionElement = createElement("section", "session");
          const header = createElement("div", "session-header");
          const actions = createElement("div", "actions");
          renderConfirm(
            actions,
            String(session.number),
            "Delete the whole session",
            "/api/sessions/" + session.number
          );
          header.append(
            createElement(
              "h2",
              "session-title",
              "[" + session.number + "] " + session.title
            ),
            actions
          );
          sessionElement.append(header);
          for (const note of notes)
            sessionElement.append(renderNote(session, note));
          sessionsElement.append(sessionElement);
        }
        if (shownCount === 0) {
          sessionsElement.append(
            createElement(
              "p",
              "status",
              sessions.length
                ? "No notes match the filter."
                : "No session notes yet."
            )
          );
        }
      }

      filterElement.addEventListener("input", render);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) loadSessions();
      });
      loadSessions();
    </script>
  </body>
</html>

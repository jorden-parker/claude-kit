<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Session notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
    />
    <style>
      :root {
        --background: #ffffff;
        --sidebar: #fafafa;
        --surface: #ffffff;
        --hover: #f2f2f2;
        --selected: #ebebeb;
        --text: #171717;
        --muted: #666666;
        --border: #eaeaea;
        --border-strong: #d4d4d4;
        --focus: #0070f3;
        --heading: #171717;
        --danger: #d8000c;
        --flash: #e8f2ff;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0a0a0a;
          --sidebar: #000000;
          --surface: #0a0a0a;
          --hover: #1a1a1a;
          --selected: #242424;
          --text: #ededed;
          --muted: #a1a1a1;
          --border: #262626;
          --border-strong: #3d3d3d;
          --focus: #3291ff;
          --heading: #ededed;
          --danger: #ff6166;
          --flash: #0d2547;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font:
          14px/1.5 "Geist",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .mono {
        font-family: "Geist Mono", ui-monospace, Menlo, monospace;
      }
      .app {
        display: grid;
        grid-template-columns: 288px minmax(0, 1fr);
        min-height: 100vh;
      }
      aside {
        position: sticky;
        top: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--sidebar);
        border-right: 1px solid var(--border);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 56px;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .brand-mark {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--text);
        color: var(--background);
        display: grid;
        place-items: center;
      }
      .search {
        padding: 12px;
      }
      input[type="search"] {
        width: 100%;
        height: 34px;
        padding: 0 10px;
        font: inherit;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        transition: border-color 150ms ease;
      }
      input[type="search"]:hover {
        border-color: var(--border-strong);
      }
      nav {
        flex: 1;
        overflow-y: auto;
        padding: 0 8px 16px;
      }
      .nav-label {
        margin: 16px 8px 6px;
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 32px;
        padding: 6px 8px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition: background-color 150ms ease;
      }
      .nav-item:hover {
        background: var(--hover);
      }
      .nav-item[aria-current="true"] {
        background: var(--selected);
        font-weight: 500;
      }
      .nav-item svg {
        flex-shrink: 0;
        color: var(--muted);
      }
      .nav-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .count {
        flex-shrink: 0;
        min-width: 22px;
        padding: 0 6px;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 12px;
        line-height: 18px;
        text-align: center;
        color: var(--muted);
      }
      .nav-notes {
        margin: 2px 0 6px 15px;
        padding-left: 8px;
        border-left: 1px solid var(--border);
        list-style: none;
      }
      .nav-note {
        min-height: 28px;
        padding: 4px 8px;
        font-size: 13px;
        color: var(--muted);
      }
      .nav-note:hover {
        color: var(--text);
      }
      main {
        min-width: 0;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 56px;
        padding: 0 32px;
        background: var(--background);
        border-bottom: 1px solid var(--border);
        overflow: hidden;
      }
      .crumb {
        color: var(--muted);
      }
      .crumb-current {
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .content {
        max-width: 880px;
        padding: 32px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .subtitle {
        margin: 4px 0 24px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .session {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 16px;
        overflow: hidden;
      }
      .session-header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--sidebar);
      }
      .session-title {
        margin: 0;
        font-size: 13px;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      .session-path {
        color: var(--muted);
        font-weight: 400;
      }
      .note {
        padding: 14px 16px;
        border-top: 1px solid var(--border);
        scroll-margin-top: 72px;
        transition: background-color 600ms ease;
      }
      .session-header + .note {
        border-top: 0;
      }
      .note.flash {
        background: var(--flash);
      }
      .note-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .note-body {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin-top: 6px;
      }
      .note-heading {
        font-weight: 600;
        color: var(--heading);
        margin-top: 4px;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        font-size: 13px;
      }
      .button {
        height: 30px;
        padding: 0 12px;
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        transition:
          border-color 150ms ease,
          background-color 150ms ease;
      }
      .button:hover {
        border-color: var(--border-strong);
        background: var(--hover);
      }
      .button.danger {
        color: var(--danger);
      }
      .button.primary {
        color: var(--background);
        background: var(--text);
        border-color: var(--text);
      }
      .button.primary:hover {
        opacity: 0.85;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      textarea {
        width: 100%;
        min-height: 160px;
        margin-top: 8px;
        padding: 10px;
        font:
          13px/1.6 "Geist Mono",
          ui-monospace,
          Menlo,
          monospace;
        color: var(--text);
        background: var(--sidebar);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .status {
        color: var(--muted);
      }
      .error {
        color: var(--danger);
      }
      #message:empty {
        display: none;
      }
      @media (max-width: 768px) {
        .app {
          grid-template-columns: 1fr;
        }
        aside {
          position: static;
          height: auto;
          max-height: 45vh;
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }
        .topbar,
        .content {
          padding-left: 16px;
          padding-right: 16px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside aria-label="Projects and notes">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
            >
              <path d="M4 6h16M4 12h16M4 18h10" />
            </svg>
          </span>
          Session notes
        </div>
        <div class="search">
          <input
            type="search"
            id="filter"
            placeholder="Filter notes…"
            aria-label="Filter notes"
          />
        </div>
        <nav id="sidebar"></nav>
      </aside>
      <main>
        <div class="topbar">
          <span class="crumb">Projects</span>
          <span class="crumb" aria-hidden="true">/</span>
          <span class="crumb-current" id="crumb">All projects</span>
        </div>
        <div class="content">
          <h1 id="heading">All projects</h1>
          <p class="subtitle" id="subtitle"></p>
          <p id="message" class="status" role="status"></p>
          <div id="sessions"></div>
        </div>
      </main>
    </div>
    <script>
      const sessionsElement = document.getElementById("sessions");
      const sidebarElement = document.getElementById("sidebar");
      const messageElement = document.getElementById("message");
      const filterElement = document.getElementById("filter");
      const headingElement = document.getElementById("heading");
      const crumbElement = document.getElementById("crumb");
      const subtitleElement = document.getElementById("subtitle");
      const folderIcon =
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
      const gridIcon =
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>';
      let sessions = [];
      let selectedProject = null;
      let editingKey = null;
      let confirmingKey = null;

      function createElement(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      }

      function createButton(label, onClick, className) {
        const button = createElement(
          "button",
          "button" + (className ? " " + className : ""),
          label
        );
        button.type = "button";
        button.addEventListener("click", onClick);
        return button;
      }

      function projectName(project) {
        return project
          ? project.split("/").filter(Boolean).pop() || project
          : "No project";
      }

      function notePreview(note) {
        const firstLine = note.lines.find((line) => line.text.trim());
        return firstLine ? firstLine.text.trim() : "Empty note";
      }

      function noteElementId(session, note) {
        return "note-" + session.number + "-" + note.number;
      }

      function showMessage(text, isError) {
        messageElement.textContent = text;
        messageElement.className = isError ? "error" : "status";
      }

      async function send(method, path, body) {
        const response = await fetch(path, {
          method,
          headers: { "Content-Type": "application/json" },
          body: body === undefined ? undefined : JSON.stringify(body),
        });
        if (!response.ok)
          throw new Error(
            (await response.text()).trim() || response.statusText
          );
      }

      async function loadSessions() {
        try {
          const response = await fetch("/api/sessions");
          if (!response.ok) throw new Error((await response.text()).trim());
          sessions = await response.json();
          if (!editingKey) render();
        } catch (error) {
          showMessage(
            error.message ||
              "Could not reach session-notes. Is it still running?",
            true
          );
        }
      }

      async function act(method, path, body, doneMessage) {
        try {
          await send(method, path, body);
          editingKey = null;
          confirmingKey = null;
          showMessage(doneMessage, false);
          await loadSessions();
        } catch (error) {
          showMessage(error.message, true);
        }
      }

      function renderConfirm(actions, key, label, path) {
        if (confirmingKey !== key) {
          actions.append(
            createButton(
              "Delete",
              () => {
                confirmingKey = key;
                render();
              },
              "danger"
            )
          );
          return;
        }
        actions.append(
          createElement("span", null, label + "?"),
          createButton(
            "Yes, delete",
            () => act("DELETE", path, undefined, "Deleted."),
            "danger"
          ),
          createButton("Keep", () => {
            confirmingKey = null;
            render();
          })
        );
      }

      function renderNote(session, note) {
        const key = session.number + "/" + note.number;
        const path =
          "/api/sessions/" + session.number + "/notes/" + note.number;
        const noteElement = createElement("article", "note");
        noteElement.id = noteElementId(session, note);
        const header = createElement("div", "note-header");
        const actions = createElement("div", "actions");
        header.append(
          createElement("span", "mono", "Note " + note.number),
          actions
        );
        noteElement.append(header);

        if (editingKey === key) {
          const textarea = createElement("textarea");
          textarea.value = note.text;
          textarea.setAttribute("aria-label", "Note " + note.number + " text");
          actions.append(
            createButton("Cancel", () => {
              editingKey = null;
              render();
            }),
            createButton(
              "Save",
              () => act("PUT", path, { text: textarea.value }, "Saved."),
              "primary"
            )
          );
          noteElement.append(textarea);
          setTimeout(() => textarea.focus());
          return noteElement;
        }

        actions.append(
          createButton("Edit", () => {
            editingKey = key;
            confirmingKey = null;
            render();
          })
        );
        renderConfirm(actions, key, "Delete this note", path);
        const body = createElement("div", "note-body");
        for (const line of note.lines) {
          body.append(
            createElement(
              "div",
              line.isHeading ? "note-heading" : null,
              line.text || " "
            )
          );
        }
        noteElement.append(body);
        return noteElement;
      }

      function matchingSessions() {
        const filterText = filterElement.value.trim().toLowerCase();
        const matches = [];
        for (const session of sessions) {
          const isSessionMatch = session.title
            .toLowerCase()
            .includes(filterText);
          const notes = session.notes.filter(
            (note) =>
              isSessionMatch || note.text.toLowerCase().includes(filterText)
          );
          if (notes.length) matches.push({ session, notes });
        }
        return matches;
      }

      function selectProject(project) {
        selectedProject = project;
        confirmingKey = null;
        render();
      }

      function revealNote(session, note) {
        selectedProject = session.project;
        render();
        const noteElement = document.getElementById(
          noteElementId(session, note)
        );
        if (!noteElement) return;
        noteElement.scrollIntoView({ block: "center" });
        noteElement.classList.add("flash");
        setTimeout(() => noteElement.classList.remove("flash"), 1200);
      }

      function createNavItem(
        iconMarkup,
        label,
        count,
        isCurrent,
        onClick,
        tooltip
      ) {
        const button = createElement("button", "nav-item");
        button.type = "button";
        button.innerHTML = iconMarkup;
        button.append(
          createElement("span", "nav-name", label),
          createElement("span", "count", String(count))
        );
        if (tooltip) button.title = tooltip;
        button.setAttribute("aria-current", String(isCurrent));
        button.addEventListener("click", onClick);
        return button;
      }

      function renderSidebar(matches) {
        sidebarElement.replaceChildren();
        const totalCount = matches.reduce(
          (sum, match) => sum + match.notes.length,
          0
        );
        sidebarElement.append(
          createNavItem(
            gridIcon,
            "All projects",
            totalCount,
            selectedProject === null,
            () => selectProject(null)
          ),
          createElement("p", "nav-label", "Projects")
        );
        const projects = new Map();
        for (const match of matches) {
          const project = match.session.project;
          if (!projects.has(project)) projects.set(project, []);
          projects.get(project).push(match);
        }
        for (const [project, projectMatches] of projects) {
          const noteCount = projectMatches.reduce(
            (sum, match) => sum + match.notes.length,
            0
          );
          sidebarElement.append(
            createNavItem(
              folderIcon,
              projectName(project),
              noteCount,
              selectedProject === project,
              () => selectProject(project),
              project
            )
          );
          const noteList = createElement("ul", "nav-notes");
          for (const { session, notes } of projectMatches) {
            for (const note of notes) {
              const listItem = createElement("li");
              const button = createElement("button", "nav-item nav-note");
              button.type = "button";
              button.append(
                createElement("span", "nav-name", notePreview(note))
              );
              button.title = session.title + " — note " + note.number;
              button.addEventListener("click", () => revealNote(session, note));
              listItem.append(button);
              noteList.append(listItem);
            }
          }
          sidebarElement.append(noteList);
        }
        if (projects.size === 0) {
          sidebarElement.append(
            createElement("p", "nav-label", "Nothing matches.")
          );
        }
      }

      function render() {
        if (!sessions.some((session) => session.project === selectedProject))
          selectedProject = null;
        const matches = matchingSessions();
        renderSidebar(matches);
        const shown =
          selectedProject === null
            ? matches
            : matches.filter(
                (match) => match.session.project === selectedProject
              );
        const title =
          selectedProject === null
            ? "All projects"
            : projectName(selectedProject);
        headingElement.textContent = title;
        crumbElement.textContent = title;
        const noteCount = shown.reduce(
          (sum, match) => sum + match.notes.length,
          0
        );
        subtitleElement.textContent =
          (selectedProject ? selectedProject + " · " : "") +
          noteCount +
          (noteCount === 1 ? " note" : " notes") +
          " in " +
          shown.length +
          (shown.length === 1 ? " session" : " sessions");
        sessionsElement.replaceChildren();
        for (const { session, notes } of shown) {
          const sessionElement = createElement("section", "session");
          const header = createElement("div", "session-header");
          const actions = createElement("div", "actions");
          renderConfirm(
            actions,
            String(session.number),
            "Delete the whole session",
            "/api/sessions/" + session.number
          );
          const sessionTitle = createElement(
            "h2",
            "session-title mono",
            "[" + session.number + "] " + session.title.split(" · ")[0]
          );
          if (session.project && selectedProject === null) {
            sessionTitle.append(
              createElement("span", "session-path", " · " + session.project)
            );
          }
          header.append(sessionTitle, actions);
          sessionElement.append(header);
          for (const note of notes)
            sessionElement.append(renderNote(session, note));
          sessionsElement.append(sessionElement);
        }
        if (shown.length === 0) {
          sessionsElement.append(
            createElement(
              "p",
              "status",
              sessions.length
                ? "No notes match the filter."
                : "No session notes yet."
            )
          );
        }
      }

      filterElement.addEventListener("input", render);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) loadSessions();
      });
      loadSessions();
    </script>
  </body>
</html>
